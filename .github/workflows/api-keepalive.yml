name: Keep API awake

on:
  # Scheduled workflows become active after this file reaches the default branch.
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: api-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API liveness endpoint
        shell: bash
        # Liveness does not query or wake the database.
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 15 \
            --max-time 90 \
            --output /dev/null \
            --write-out 'HTTP %{http_code}; total %{time_total}s\n' \
            https://examr-api.onrender.com/api/health/live
